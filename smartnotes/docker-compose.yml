version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartnotes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartnotes
      POSTGRES_USER: smartnotes_user
      POSTGRES_PASSWORD: smartnotes_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - smartnotes-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartnotes_user -d smartnotes"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartnotes-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Database=smartnotes;Username=smartnotes_user;Password=smartnotes_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartnotes-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/notes/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartnotes-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartnotes-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smartnotes-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartnotes.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8081:80"
    depends_on:
      - postgres
    networks:
      - smartnotes-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  smartnotes-network:
    driver: bridge